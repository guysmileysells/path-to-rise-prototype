<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PATH to RISE — Today parity design mock</title>
<style>
:root{--bg:#f5f5ef;--panel:#fff;--ink:#203d33;--muted:#5f7068;--line:#dce3da;--accent:#285e48;--on:#fff;--soft:#e4eddf;--danger:#913d34;--danger-soft:#fcf1ee;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--display:Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button,input,select,summary{min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}svg{width:19px;height:19px;flex-shrink:0}h1,h2,h3,p{margin:0}h1{font:400 32px/1.12 var(--display);letter-spacing:-.8px;margin:8px 0 10px}h2{font-size:17px;font-weight:550}h3{font-size:15px;font-weight:550}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}.review-label{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:var(--ink);color:var(--on);font-size:10px;letter-spacing:1px;font-weight:600}.phone{height:calc(100dvh - 32px);width:100%;max-width:420px;margin:auto;display:grid;grid-template-rows:66px minmax(0,1fr) 78px;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;overflow:hidden}.topbar{padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:17px;font-weight:600;letter-spacing:2px;white-space:nowrap}.brand small{font-size:9px;letter-spacing:1px}.space{display:flex;align-items:center;gap:5px;padding:0;background:none;border:0;font-size:12px;color:var(--muted)}.space svg{width:15px;height:15px}main{padding:8px 22px 24px;overflow:auto;min-width:0;scroll-behavior:auto}.intro{font-size:14px;color:var(--muted)}.hero{background:var(--soft);border-radius:20px;padding:18px;margin-top:18px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;right:-42px;top:-65px;width:125px;height:125px;border:1px solid var(--line);border-radius:50%;pointer-events:none}.hero h2{margin:8px 0}.hero p{color:var(--muted);font-size:13px;margin-bottom:14px}.primary,.secondary{border:0;border-radius:12px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;min-height:48px;font-size:14px;font-weight:550}.primary{background:var(--accent);color:var(--on)}.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:18px;margin-bottom:5px}.text-btn{border:0;background:none;font-size:12px;color:var(--accent);padding:4px 0}.day-card{border-bottom:1px solid var(--line);padding:8px 0 14px}.day-card h3{font:400 22px/1.2 var(--display);margin:5px 0 8px}.day-meta{font-size:11px;color:var(--muted)}.next-action{font-size:13px;margin:7px 0;color:var(--ink)}.day-count{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:8px 0}.day-count span:last-child{font-size:11px}progress{width:100%;height:5px;display:block;border:0;border-radius:5px;overflow:hidden;background:var(--line);accent-color:var(--accent);margin:7px 0 12px}progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:var(--accent);border-radius:5px}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;min-height:66px;font-size:14px}.row .copy{flex:1;min-width:0}.row small{display:block;font-size:12px;color:var(--muted);margin-top:3px}.icon{background:var(--soft);border-radius:12px;display:grid;place-items:center;width:38px;height:38px;flex-shrink:0}.subtle-note{font-size:11px;color:var(--muted);margin-top:14px}.program-hero .day-card{border-bottom:0;padding-bottom:0}.program-hero .section-head{margin-top:0}.program-hero h3{font-size:24px}.reset-row{margin-top:14px}.reset-row .copy strong{display:block;font-weight:550}.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel);padding:8px 10px 10px;gap:2px}.nav button{border:0;background:none;color:var(--muted);border-radius:12px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px}.nav button[aria-current=page]{background:var(--soft);color:var(--ink)}.back{display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--muted);font-size:12px}.back svg{transform:rotate(180deg);width:16px}.sheet-title{font-size:31px;margin-top:6px}.sheet-sub{color:var(--muted);font-size:13px;margin-bottom:16px}.notice{padding:14px;background:var(--soft);border-radius:14px;font-size:13px;line-height:1.5;margin:10px 0 14px}.notice strong{display:block;font-weight:550;margin-bottom:4px}.details{border-bottom:1px solid var(--line);padding:0 0 3px;margin:4px 0}.details summary{cursor:pointer;font-size:14px;font-weight:550;padding:12px 0}.details p{font-size:13px;color:var(--muted);margin:4px 0 12px}.clear-heading{margin-top:19px;margin-bottom:4px}.clear{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--danger);font-size:13px;font-weight:550}.clear small{color:var(--muted);display:block;font-weight:400;font-size:12px;margin-top:3px}.permission{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:11px 0}.permission span{font-size:12px;color:var(--muted);display:block}.permission button{border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:12px;padding:7px 10px;max-width:130px}.permission h3{font-size:14px}.capability{font-size:12px;background:var(--soft);border-radius:12px;padding:12px;margin:10px 0}.reminder{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;align-items:start}.reminder details{min-width:0}.reminder summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;list-style:none;min-height:48px}.reminder summary::-webkit-details-marker{display:none}.reminder summary strong{font-size:14px;font-weight:550;display:block}.reminder summary small{font-size:11px;color:var(--muted);display:block;margin-top:2px}.reminder summary:after{content:'+';font-size:18px;color:var(--muted)}.reminder details[open] summary:after{content:'−'}.toggle{width:46px;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:20px;font-size:12px;align-self:start;margin-top:2px}.toggle[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.fields{padding:3px 0 8px}.fields label{display:block;font-size:12px;margin-top:8px;color:var(--muted)}input,select{display:block;width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:4px;font-size:13px}.fields p{color:var(--muted);font-size:12px;margin-top:8px}.quiet-head{display:flex;align-items:center;justify-content:space-between;margin-top:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two label{font-size:12px;color:var(--muted)}.quiet-rule{font-size:11px;color:var(--muted);margin-top:8px}.privacy-mode{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 0}.privacy-mode summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;list-style:none;font-size:12px;min-height:44px}.privacy-mode p{margin:6px 0 10px}.preview{border-left:2px solid var(--accent);padding:5px 0 5px 10px;margin:8px 0;font-size:12px}.toast{font-size:12px;min-height:18px;margin-top:10px;color:var(--accent)}dialog{border:1px solid var(--line);border-radius:22px;padding:24px;width:calc(100% - 40px);max-width:350px;color:var(--ink);background:var(--bg)}dialog::backdrop{background:#203d3370}dialog h2{font:400 26px/1.2 var(--display);margin:0 0 12px}dialog p{font-size:14px;color:var(--muted);margin-bottom:16px}dialog .primary,dialog .secondary{margin-top:10px}.danger-button{background:var(--danger)!important}.dialog-note{font-size:11px!important;margin:14px 0 0!important}.status{font-size:11px;color:var(--accent);margin-top:5px}.program-hero .day-meta{margin-top:5px}#screen-state{display:none}
@media(min-width:421px){body{background:#e9ede5}.review-label{max-width:420px;margin:auto}.phone{border-radius:0 0 24px 24px}}@media(max-width:345px){.topbar{padding:0 17px}main{padding-left:17px;padding-right:17px}h1{font-size:29px}.brand{font-size:15px}.permission button{max-width:112px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body><div class="review-label"><span id="review-name">C · PRIVACY + LOCAL DATA</span><span>DESIGN MOCK</span></div><section class="phone" aria-label="PATH to RISE Today design mock"><header class="topbar"><div class="brand">PATH <small>to</small> RISE</div><button class="space" data-open="privacy" aria-label="Your space: privacy, reminders and local data"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="lock-keyhole" aria-hidden="true" class="lucide lucide-lock-keyhole"><circle cx="12" cy="16" r="1"></circle><rect x="3" y="10" width="18" height="12" rx="2"></rect><path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg> Your space</button></header><main id="content"></main><nav class="nav" aria-label="Main navigation"><button data-dest="Today" aria-current="page"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="sun" aria-hidden="true" class="lucide lucide-sun"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>Today</button><button data-dest="Reset"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="wind" aria-hidden="true" class="lucide lucide-wind"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"></path><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"></path><path d="M9.8 4.4A2 2 0 1 1 11 8H2"></path></svg>Reset</button><button data-dest="My Path"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="route" aria-hidden="true" class="lucide lucide-route"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg>My Path</button><button data-dest="Support"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="heart-handshake" aria-hidden="true" class="lucide lucide-heart-handshake"><path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"></path></svg>Support</button></nav></section><dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div id="dialog-actions"></div><p class="dialog-note">Design preview only. No live data or browser permission is changed.</p></dialog>
<script>
const icons={"lock-keyhole": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"lock-keyhole\" aria-hidden=\"true\" class=\"lucide lucide-lock-keyhole\"><circle cx=\"12\" cy=\"16\" r=\"1\"></circle><rect x=\"3\" y=\"10\" width=\"18\" height=\"12\" rx=\"2\"></rect><path d=\"M7 10V7a5 5 0 0 1 10 0v3\"></path></svg>", "arrow-right": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"arrow-right\" aria-hidden=\"true\" class=\"lucide lucide-arrow-right\"><path d=\"M5 12h14\"></path><path d=\"m12 5 7 7-7 7\"></path></svg>", "route": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"route\" aria-hidden=\"true\" class=\"lucide lucide-route\"><circle cx=\"6\" cy=\"19\" r=\"3\"></circle><path d=\"M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15\"></path><circle cx=\"18\" cy=\"5\" r=\"3\"></circle></svg>", "chevron-right": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"chevron-right\" aria-hidden=\"true\" class=\"lucide lucide-chevron-right\"><path d=\"m9 18 6-6-6-6\"></path></svg>", "bookmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"bookmark\" aria-hidden=\"true\" class=\"lucide lucide-bookmark\"><path d=\"M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z\"></path></svg>", "sun": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"sun\" aria-hidden=\"true\" class=\"lucide lucide-sun\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 2v2\"></path><path d=\"M12 20v2\"></path><path d=\"m4.93 4.93 1.41 1.41\"></path><path d=\"m17.66 17.66 1.41 1.41\"></path><path d=\"M2 12h2\"></path><path d=\"M20 12h2\"></path><path d=\"m6.34 17.66-1.41 1.41\"></path><path d=\"m19.07 4.93-1.41 1.41\"></path></svg>", "wind": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"wind\" aria-hidden=\"true\" class=\"lucide lucide-wind\"><path d=\"M12.8 19.6A2 2 0 1 0 14 16H2\"></path><path d=\"M17.5 8a2.5 2.5 0 1 1 2 4H2\"></path><path d=\"M9.8 4.4A2 2 0 1 1 11 8H2\"></path></svg>", "heart-handshake": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-lucide=\"heart-handshake\" aria-hidden=\"true\" class=\"lucide lucide-heart-handshake\"><path d=\"M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762\"></path></svg>"};
const layout='a', initialView='privacy';
const params=new URLSearchParams(location.search);const state=params.get('state')||'partial';const complete=state==='complete';const fresh=state==='fresh';
let currentView=initialView;const content=document.querySelector('#content');const dialog=document.querySelector('#dialog');
const arrow=icons['arrow-right'];const chev=icons['chevron-right'];
const row=(title,sub,icon,action)=>`<button class="row" data-dest="${action}"><span class="icon">${icons[icon]}</span><span class="copy">${title}<small>${sub}</small></span>${chev}</button>`;
const button=(label,action,kind='primary')=>`<button class="${kind}" data-dest="${action}">${label}${arrow}</button>`;
const back=()=>`<button class="back" data-open="home">${arrow} Today</button>`;
const count=complete?17:fresh?0:3;
const day=complete?28:1;
function program(kind){ const task=fresh?'Set your alarm':'Drink two glasses of water';return `<div class="day-card"><div class="day-meta">${complete?'28-Day Journey complete':`Day ${day} of 28 · Week 1`}</div><h3>${complete?'Your reset is complete.':'Resetting the Baseline'}</h3><p class="next-action">${complete?'Keep useful practices close. No next day to chase.':`Next: ${task}`}</p><div class="day-count"><span>${count} of 17 actions complete</span><span>${complete?'Day 28':'Move at your pace.'}</span></div><progress max="17" value="${count}" aria-label="Completed actions"></progress>${button(complete?'Reset or revisit a practice':fresh?'Start Day 1':'Continue Day 1',complete?'Reset':'Continue',kind)}<div class="status">${complete?'Review your journey in My Path.':fresh?'Next program step. Opening it does not mark it done.':'Continue where you left off.'}</div></div>`}
function home(){const head=`<div class="eyebrow">A moment for you</div><h1>Leave the shift.<br>Keep yourself.</h1><p class="intro">${state==='returning'?'Welcome back. Your place is still here.':'Welcome back. Start where you are.'}</p>`;
const reset=`<section class="hero"><div class="eyebrow">Right here. Right now.</div><h2>What would help today?</h2><p>A little space between what happened<br>and what comes next.</p>${button('Reset me now','Reset')}</section>`;
const pathHead=`<div class="section-head"><h2>Your path</h2><button class="text-btn" data-dest="My Path">View program</button></div>`;
const shortcut=params.get('shortcut')==='none'?`<div class="notice"><strong>Source-backed</strong>Your day follows the structured 28-day program.</div>`:row('Walk + Stretch Reset','From Week 1 · A practice to revisit','wind','Walk + Stretch Reset');
content.innerHTML=head+(layout==='a'?reset+pathHead+program('secondary'):`<section class="hero program-hero">${pathHead}${program('primary')}</section>${row('Reset me now','A pause, whenever you need one.','wind','Reset')}`)+`<div class="section-head"><h2>Within reach</h2></div>${shortcut}${row('My Quick Kit','Your favourites and recent practices.','bookmark','My Quick Kit')}<button class="row" data-open="privacy"><span class="copy">Privacy, reminders + local data<small>Optional settings, when you need them.</small></span>${chev}</button><p class="subtle-note">Prototype progress and saved writing stay in this browser.</p>`;}
function privacy(){content.innerHTML=back()+`<h1 class="sheet-title">Your space</h1><p class="sheet-sub">Privacy, reminders + local data.</p><div class="notice"><strong>Stored in this browser</strong>Progress, saved writing, favourites and recents stay here. No account sync. Clearing site data removes them.</div><details class="details" open><summary>How suggestions work</summary><p>Program position, favourites and recent practices help choose your next step. Private writing is never analyzed or used for suggestions.</p></details><button class="row" data-open="reminders"><span class="icon">${icons.sun}</span><span class="copy">Reminders<small>Optional · off until you choose</small></span>${chev}</button><h2 class="clear-heading">Local data controls</h2><p class="small muted">Choose exactly what to clear.</p><button class="clear" data-clear="program"><span>Clear progress + reflections<small>Keep Toolbox favourites and recents.</small></span>${chev}</button><button class="clear" data-clear="tools"><span>Clear Toolbox preferences<small>Remove favourites and recent-tool history.</small></span>${chev}</button><button class="clear" data-clear="all"><span>Clear all local prototype data<small>Progress, writing, tools and reminder settings.</small></span>${chev}</button><p class="subtle-note">Each action asks for confirmation. Nothing clears just by opening this page.</p><p id="result" class="toast" role="status"></p>`}
function reminderRow(id,title,sub,fields,disabled=false){return `<section class="reminder"><details><summary><span><strong>${title}</strong><small>${sub}</small></span></summary><div class="fields">${fields}</div></details><button class="toggle" data-toggle="${id}" aria-label="${title}: off" aria-pressed="false" ${disabled?'disabled':''}>Off</button></section>`}
function reminders(){content.innerHTML=`<button class="back" data-open="privacy">${arrow} Your space</button><h1 class="sheet-title">Reminders</h1><p class="sheet-sub" style="margin-bottom:10px">Optional. Discreet. Built around your hours.</p><div class="capability">Prototype reminders need this tab open.<br>Not reliable when the app is closed.</div><section class="permission"><div><h3>Browser permission</h3><span>Not requested</span></div><button data-permission>Explain + request</button></section><details class="privacy-mode"><summary>Discreet privacy mode <span>Copy preview +</span></summary><p>Neutral copy only. No writing, RESET needs or diagnosis in notifications.</p><div class="preview"><strong>PATH to RISE</strong><br>Your next practice is ready when you are.</div><div class="preview">A few minutes for yourself, when you are ready.</div><div class="preview">Continue when you are ready.</div><div class="preview">Your saved practices are here when you want them.</div></details>`+
reminderRow('program','Program reminder',complete?'Stopped after Day 28':'08:00 · Continue your current day',`<label>Time<input type="time" value="08:00" aria-label="Program reminder time"></label><p>Optional continuation. Stops after Day 28; never creates Day 29.</p>`,complete)+
reminderRow('practice','Practice reminder','Choose a practice and time',`<label>Practice<select id="practice-choice"><option value="">Choose a practice</option><option>Mirror Breathwork</option><option>Hydration Reset</option><option>Non-Dominant Hand Training</option><option>Mirror Work</option><option>Gratitude &amp; Reflection Journal</option><option>Immediate Movement</option></select></label><label>Time<input type="time" value="18:00" aria-label="Practice reminder time"></label><p>A favourite is not consent. Choose a practice and explicitly switch this on.</p>`,true)+
reminderRow('return','Return reminder',complete?'Not needed after Day 28':'After 7 days away · one gentle reminder',`<label>After days away<input type="number" value="7" min="3" max="30" aria-label="Days before return reminder"></label><label>Time<input type="time" value="10:00" aria-label="Return reminder time"></label><p>One gentle return reminder, then stop. No pressure or escalation.</p>`,complete)+
reminderRow('post','Post-program reminder','For after Day 28 · reusable practices',`<label>Time<input type="time" value="09:00" aria-label="Post-program reminder time"></label><p>Only active after Day 28. Opens reusable practices, not another day.</p>`)+
`<div class="quiet-head"><h3>Quiet hours</h3><button class="toggle" data-toggle="quiet" aria-label="Quiet hours: on" aria-pressed="true">On</button></div><div class="two"><label>From<input type="time" value="22:00" aria-label="Quiet hours start"></label><label>Until<input type="time" value="07:00" aria-label="Quiet hours end"></label></div><p class="quiet-rule">Overnight is fine. Reminders wait until quiet hours end.</p><p id="result" class="toast" role="status"></p>`;}
function render(view){currentView=view;content.scrollTop=0;if(view==='privacy')privacy();else if(view==='reminders')reminders();else home();}
function showDialog(title,copy,actionLabel='Back to Today',action=null){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;document.querySelector('#dialog-actions').innerHTML=action?`<button class="primary danger-button" id="confirm">${actionLabel}</button><button class="secondary" id="cancel">Cancel</button>`:`<button class="secondary" id="cancel">${actionLabel}</button>`;document.querySelector('#cancel').onclick=()=>dialog.close();if(action)document.querySelector('#confirm').onclick=()=>{action();dialog.close()};dialog.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){render(b.dataset.open);return}if(b.dataset.dest){const dest=b.dataset.dest;if(dest==='Today'){render('home');return}showDialog(dest==='Continue'?'Day 1: Resetting the Baseline':dest,dest==='Continue'?`Continue opens My Path at ${fresh?'Set your alarm':'Drink two glasses of water'}, using the saved day and action. This review mock does not complete an action.`:`This entry keeps the existing ${dest} destination available from Today. This is a Today design preview, not a replacement exercise.`,'Return to Today');return}if(b.dataset.toggle){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',b.dataset.toggle+' reminder: '+(on?'on':'off'));b.textContent=on?'On':'Off';document.querySelector('#result').textContent='Mock preference changed. Delivery is not scheduled.';return}if(b.hasAttribute('data-permission')){showDialog('You choose whether to allow it.','Turning on a preference is not browser permission or proof of delivery. In the real prototype, a separate browser prompt follows this explanation. This mock requests no permission.','Keep reminders off');return}if(b.dataset.clear){const messages={program:['Clear progress + reflections?','This would delete program progress and saved writing in this browser. Toolbox favourites and recents would stay.','Clear progress + reflections'],tools:['Clear Toolbox preferences?','This would remove tool favourites, recents and standalone tool history. Program progress and writing would stay.','Clear Toolbox preferences'],all:['Clear all local prototype data?','This would delete progress, saved writing, Toolbox history and reminder settings in this browser. This cannot be undone.','Clear all local data']};const [title,copy,label]=messages[b.dataset.clear];showDialog(title,copy,label,()=>document.querySelector('#result').textContent='Confirmation preview only — no live data cleared.');}});
document.addEventListener('change',e=>{if(e.target.id==='practice-choice'){const b=document.querySelector('[data-toggle=practice]');b.disabled=!e.target.value;if(b.disabled){b.textContent='Off';b.setAttribute('aria-pressed','false')}}});
render(initialView);
</script></body></html>
